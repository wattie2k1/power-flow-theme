pf_stat_card:
  styles:
    card:
    - background: var(--card-background-color)
    - border-radius: var(--ha-card-border-radius, 16px)
    - border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color)
    - box-shadow: var(--ha-card-box-shadow)
    - padding: 16px
    - height: 125px
    - box-sizing: border-box
    grid:
    - grid-template-areas: '"container"'
    - grid-template-columns: 1fr
    custom_fields:
      container:
      - width: 100%
      - height: 100%
      - pointer-events: none
  extra_styles: "/* Kopfzeile: Icon + Titel */\n.pf-head { display: flex; align-items: center; gap: 8px; }\n.pf-head-icon { width: 20px; height: 20px; --mdc-icon-size: 20px; display: flex; color: var(--pf-accent);\
    \ }\n.pf-head-title { color: var(--pf-text-label); font-size: 15px; font-weight: 500; white-space: nowrap; }\n/* Großes Status-Icon rechts, pulsiert wenn aktiv (Farbe per --pf-icon-color) */\n.pf-big-icon\
    \ ha-icon { --mdc-icon-size: 60px; color: var(--pf-icon-color, var(--pf-text-muted)); transition: all 0.3s ease; }\n.pf-big-icon.pf-active ha-icon { animation: pf-pulse 2s infinite ease-in-out; }\n\
    @keyframes pf-pulse {\n  0%   { transform: scale(0.95); opacity: 0.8; }\n  50%  { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px var(--pf-icon-color)); }\n  100% { transform: scale(0.95);\
    \ opacity: 0.8; }\n}\n"

